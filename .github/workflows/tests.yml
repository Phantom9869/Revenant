# Revenant's own unit tests (not the patient's: those run in the bwrap sandbox locally).
# Everything here is offline: models, GitHub, Backboard, Browserbase and Sentry are stubbed.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install '.[test]' ruff
      - name: Installed command works
        run: |
          revenant --version
          python -m revenant list
      - run: ruff check --select F,E9 .
      - run: pytest -q
